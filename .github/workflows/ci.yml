name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, torch ${{ matrix.torch-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — минимально поддерживаемая версия (NFR, раздел 4.2 диплома);
        # 3.12 — версия, на которой реально проводились эксперименты (3.12.10).
        python-version: ["3.10", "3.12"]
        torch-version: ["latest"]
        include:
          - python-version: "3.10"
            torch-version: "2.5.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (нужны OpenCV для импорта cv2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install CPU-сборку PyTorch
        run: |
          if [ "${{ matrix.torch-version }}" = "latest" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${{ matrix.torch-version }}" --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install samit (editable) + dev-зависимости
        run: pip install -e ".[dev]"

      - name: Lint — flake8
        run: flake8 samit scripts tests

      - name: Format check — black
        run: black --check --diff samit scripts tests

      - name: Type check — mypy
        run: mypy samit

      - name: Tests — pytest (+ coverage)
        run: pytest --cov --cov-report=term-missing

      - name: Inference smoke tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "2"
        run: |
          python tests/test_inference.py
          python tests/test_tiled_tensor.py
          python tests/test_infer_bug.py
